<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PrecizionMC</title>

<style>
body{
margin:0;
overflow:hidden;
background:black;
font-family:Arial;
}
body:active{cursor:grabbing}

/* ===== TOP PANEL ===== */
#topPanel{
position:fixed;
top:0;
left:0;
width:100%;
height:20vh;
z-index:10;

background:linear-gradient(
to bottom,
rgba(40,0,0,0.9),
rgba(20,0,0,0.7),
rgba(0,0,0,0.2)
);
}

/* ===== TITLE ===== */
#banner{
position:absolute;
top:0;
width:100%;
height:10vh;
display:flex;
align-items:center;
justify-content:center;
font-size:36px;
color:#ff2222;
letter-spacing:4px;

text-shadow:
0 0 5px #ff0000,
0 0 10px #ff0000,
0 0 20px #aa0000;
}

/* ===== BUTTON BAR ===== */
#buttonBar{
position:absolute;
top:10vh;
width:100%;
height:10vh;
display:flex;
justify-content:center;
align-items:center;
gap:20px;
}

/* ===== WRAPPER ===== */
.menuWrapper{
position:relative;
display:flex;
flex-direction:column;
align-items:center;
}

/* ===== MAIN BUTTON ===== */
.menuBtn{
width:140px;
height:50px;
color:#ff3333;
background:linear-gradient(145deg,#2a2a2a,#111);
border:2px solid #444;
border-radius: 8px;

text-shadow:
0 0 4px #ff0000,
0 0 8px #ff0000;

cursor:pointer;
}

/* ===== DROPDOWN (WITH GAP) ===== */
.dropdown{
position:absolute;
top:calc(100% + 10px); /* 👈 GAP ADDED HERE */
left:0;

display:flex;
flex-direction:column;
gap:6px;

opacity:0;
pointer-events:none;
transform:translateY(-10px);
transition:0.2s;
}

/* ===== HOVER FIX (NO DISAPPEAR) ===== */
.menuWrapper:hover .dropdown,
.dropdown:hover{
opacity:1;
pointer-events:auto;
transform:translateY(0);
}

/* ===== DROPDOWN BUTTONS ===== */
.dropBtn{
width:140px;
height:50px;
color:#ff3333;
background:linear-gradient(145deg,#2a2a2a,#111);
border:2px solid #444;
border-radius: 8px;

text-shadow:
0 0 4px #ff0000,
0 0 8px #ff0000;

cursor:pointer;
}

.dropBtn:hover,
.menuBtn:hover{
box-shadow:0 0 10px #ff0000;
}

</style>
</head>

<body>

<div id="topPanel">
<div id="banner">PrecizionMC</div>

<div id="buttonBar">

<div class="menuWrapper">
<button class="menuBtn">News</button>
<div class="dropdown">
<button class="dropBtn">Game Updates</button>
<button class="dropBtn">Server Updates</button>
</div>
</div>

<div class="menuWrapper">
<button class="menuBtn">Server</button>
<div class="dropdown">
<button class="dropBtn">Survival (coming soon)</button>
<button class="dropBtn">Practice (coming soon)</button>
<button class="dropBtn">Creative (coming soon)</button>
<button class="dropBtn">Kit PvP (coming soon)</button>
<button class="dropBtn">Bedwars (coming soon)</button>
</div>
</div>

<div class="menuWrapper">
<button class="menuBtn">Games</button>
<div class="dropdown">
<button class="dropBtn">Shooter Games</button>
<button class="dropBtn">Brain Games</button>
<button class="dropBtn">Tank Games</button>
<button class="dropBtn">Mech Games</button>
<button class="dropBtn">Signature Games</button>
</div>
</div>

<div class="menuWrapper">
<button class="menuBtn">Chat</button>
<div class="dropdown">
<button class="dropBtn">In Game Chat</button>
<button class="dropBtn">Forums</button>
</div>
</div>

<div class="menuWrapper">
<button class="menuBtn">Settings</button>
<div class="dropdown">
<button class="dropBtn">Profile</button>
<button class="dropBtn">Website</button>
<button class="dropBtn">Shopping Cart</button>
<button class="dropBtn">Purchasing History</button>
</div>
</div>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

// SCENE
const scene=new THREE.Scene()

const camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000)

const renderer=new THREE.WebGLRenderer({antialias:true})
renderer.setSize(window.innerWidth,window.innerHeight)
renderer.setClearColor(0x000000)
document.body.appendChild(renderer.domElement)

// CAMERA
let radius=60,yaw=0,pitch=0

// DOTS
const dots=[]
const dotCount=50

for(let i=0;i<dotCount;i++){
const geo=new THREE.SphereGeometry(0.25,6,6)
const mat=new THREE.MeshBasicMaterial({color:0xff0000})
const dot=new THREE.Mesh(geo,mat)

dot.position.set(
(Math.random()-0.5)*80,
(Math.random()-0.5)*50,
(Math.random()-0.5)*80
)

dot.userData.vel=new THREE.Vector3(
(Math.random()-0.5)*0.04,
(Math.random()-0.5)*0.04,
(Math.random()-0.5)*0.04
)

scene.add(dot)
dots.push(dot)
}

// LINES
const maxLines=2000
const positions=new Float32Array(maxLines*6)

const geometry=new THREE.BufferGeometry()
geometry.setAttribute("position",new THREE.BufferAttribute(positions,3))

const material=new THREE.LineBasicMaterial({color:0xff0000})
const lines=new THREE.LineSegments(geometry,material)

scene.add(lines)

// CONTROLS
let rotating=false

document.addEventListener("contextmenu",e=>e.preventDefault())

document.addEventListener("mousedown",e=>{
if(e.button===2) rotating=true
})

document.addEventListener("mouseup",e=>{
if(e.button===2) rotating=false
})

document.addEventListener("mousemove",e=>{
if(!rotating)return
yaw-=e.movementX*0.005
pitch-=e.movementY*0.005
pitch=Math.max(-Math.PI/2,Math.min(Math.PI/2,pitch))
})

document.addEventListener("wheel",e=>{
radius+=e.deltaY*0.05
radius=Math.max(20,Math.min(150,radius))
})

// ANIMATE
function animate(){
requestAnimationFrame(animate)

dots.forEach(dot=>{
dot.position.add(dot.userData.vel)

const lim=40
if(Math.abs(dot.position.x)>lim)dot.userData.vel.x*=-1
if(Math.abs(dot.position.y)>lim)dot.userData.vel.y*=-1
if(Math.abs(dot.position.z)>lim)dot.userData.vel.z*=-1
})

let ptr=0
const maxDist=18

for(let i=0;i<dots.length;i++){
let connections=0
for(let j=i+1;j<dots.length;j++){

if(connections>3)break

const a=dots[i].position
const b=dots[j].position

const dx=a.x-b.x
const dy=a.y-b.y
const dz=a.z-b.z

if(dx*dx+dy*dy+dz*dz<maxDist*maxDist){

positions[ptr++]=a.x
positions[ptr++]=a.y
positions[ptr++]=a.z

positions[ptr++]=b.x
positions[ptr++]=b.y
positions[ptr++]=b.z

connections++
}
}
}

geometry.setDrawRange(0,ptr/3)
geometry.attributes.position.needsUpdate=true

camera.position.x=Math.cos(yaw)*Math.cos(pitch)*radius
camera.position.y=Math.sin(pitch)*radius
camera.position.z=Math.sin(yaw)*Math.cos(pitch)*radius

camera.lookAt(0,0,0)

renderer.render(scene,camera)
}

animate()

window.addEventListener("resize",()=>{
camera.aspect=window.innerWidth/window.innerHeight
camera.updateProjectionMatrix()
renderer.setSize(window.innerWidth,window.innerHeight)
})

</script>

</body>
</html>
